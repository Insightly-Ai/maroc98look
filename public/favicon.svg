<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="18" fill="#111111"/>

  <!-- Globe at top -->
  <circle cx="50" cy="22" r="14" fill="#C8921A"/>
  <circle cx="50" cy="22" r="14" fill="none" stroke="#F5D060" stroke-width="1"/>
  <!-- Globe lines -->
  <ellipse cx="50" cy="22" rx="6" ry="14" fill="none" stroke="#F5D060" stroke-width="0.8" opacity="0.6"/>
  <line x1="36" y1="22" x2="64" y2="22" stroke="#F5D060" stroke-width="0.8" opacity="0.6"/>
  <line x1="37" y1="16" x2="63" y2="16" stroke="#F5D060" stroke-width="0.8" opacity="0.6"/>
  <line x1="37" y1="28" x2="63" y2="28" stroke="#F5D060" stroke-width="0.8" opacity="0.6"/>
  <!-- Shine on globe -->
  <circle cx="44" cy="17" r="4" fill="#F5D060" opacity="0.25"/>

  <!-- Left figure arm up -->
  <path d="M36 36 Q30 30 36 23" fill="none" stroke="#D4A843" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right figure arm up -->
  <path d="M64 36 Q70 30 64 23" fill="none" stroke="#D4A843" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left figure body -->
  <path d="M36 36 Q33 45 36 54" fill="none" stroke="#D4A843" stroke-width="4" stroke-linecap="round"/>
  <!-- Right figure body -->
  <path d="M64 36 Q67 45 64 54" fill="none" stroke="#D4A843" stroke-width="4" stroke-linecap="round"/>

  <!-- Figures connecting at waist -->
  <path d="M36 46 Q50 50 64 46" fill="none" stroke="#C49B2E" stroke-width="3" stroke-linecap="round"/>

  <!-- Malachite base narrow -->
  <rect x="43" y="54" width="14" height="8" rx="2" fill="#C49B2E"/>

  <!-- Base tier 1 -->
  <rect x="33" y="62" width="34" height="7" rx="2" fill="#1B5E3B"/>
  <!-- Base tier 2 -->
  <rect x="28" y="69" width="44" height="9" rx="3" fill="#154D2E"/>
  <!-- Gold rim on base -->
  <rect x="28" y="69" width="44" height="2" rx="1" fill="#D4A843"/>
  <rect x="28" y="76" width="44" height="2" rx="1" fill="#D4A843"/>
</svg>
