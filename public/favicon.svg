<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/>
      <stop offset="50%" stop-color="#D4A843"/>
      <stop offset="100%" stop-color="#A8782A"/>
    </linearGradient>
    <linearGradient id="base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E7D4F"/>
      <stop offset="100%" stop-color="#1B4D30"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="#0A0A0A"/>

  <!-- Globe -->
  <circle cx="50" cy="19" r="13" fill="url(#gold)"/>
  <ellipse cx="50" cy="19" rx="5.5" ry="13" fill="none" stroke="#A8782A" stroke-width="1" opacity="0.5"/>
  <line x1="37" y1="19" x2="63" y2="19" stroke="#A8782A" stroke-width="1" opacity="0.5"/>
  <circle cx="44" cy="14" r="3.5" fill="#F9E88A" opacity="0.3"/>

  <!-- Trophy body: two figures as a filled silhouette -->
  <!-- Left figure: curves outward then inward to waist -->
  <path d="
    M50 32
    C44 32, 34 35, 30 28
    C27 23, 33 19, 37 19
    C40 24, 45 27, 50 32
    Z
  " fill="url(#gold)"/>
  <!-- Right figure mirror -->
  <path d="
    M50 32
    C56 32, 66 35, 70 28
    C73 23, 67 19, 63 19
    C60 24, 55 27, 50 32
    Z
  " fill="url(#gold)"/>

  <!-- Waist / narrow stem -->
  <rect x="44" y="32" width="12" height="10" rx="3" fill="url(#gold)"/>

  <!-- Connector to base -->
  <rect x="46" y="42" width="8" height="12" rx="2" fill="#C49B2E"/>

  <!-- Malachite base top tier -->
  <rect x="32" y="54" width="36" height="9" rx="3" fill="url(#base)"/>
  <rect x="32" y="54" width="36" height="2" rx="1" fill="#D4A843"/>

  <!-- Malachite base bottom tier -->
  <rect x="26" y="63" width="48" height="11" rx="4" fill="url(#base)"/>
  <rect x="26" y="63" width="48" height="2.5" rx="1" fill="#D4A843"/>
  <rect x="26" y="71.5" width="48" height="2.5" rx="1" fill="#D4A843"/>
</svg>
