<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/>
      <stop offset="40%" stop-color="#D4A020"/>
      <stop offset="100%" stop-color="#A07010"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="#111"/>

  <!-- Globe top -->
  <ellipse cx="50" cy="23" rx="19" ry="18" fill="url(#g)"/>
  <!-- Continent-like details on globe -->
  <path d="M38 18 Q42 14 46 17 Q44 21 40 20Z" fill="#C8920A" opacity="0.5"/>
  <path d="M52 14 Q57 12 60 16 Q58 19 55 18Z" fill="#C8920A" opacity="0.5"/>
  <path d="M44 24 Q48 22 51 25 Q49 28 46 27Z" fill="#C8920A" opacity="0.4"/>

  <!-- Trophy body: two figures spiraling — left side -->
  <path d="M31 41 Q27 36 33 31 Q36 28 39 32 Q43 37 44 44 Q45 50 44 54"
        fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
  <!-- Right side figure -->
  <path d="M69 41 Q73 36 67 31 Q64 28 61 32 Q57 37 56 44 Q55 50 56 54"
        fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>

  <!-- Waist narrow part -->
  <path d="M44 54 Q50 58 56 54 L55 62 Q50 65 45 62Z" fill="url(#g)"/>

  <!-- Base flare -->
  <path d="M45 62 Q50 65 55 62 Q58 68 60 72 L40 72 Q42 68 45 62Z" fill="url(#g)"/>

  <!-- Horizontal rings on base -->
  <rect x="36" y="72" width="28" height="3.5" rx="1.5" fill="url(#g)"/>
  <rect x="34" y="76.5" width="32" height="3.5" rx="1.5" fill="url(#g)"/>
  <rect x="32" y="81" width="36" height="4" rx="2" fill="url(#g)"/>

  <!-- Thin white lines between rings for detail -->
  <rect x="36" y="75.2" width="28" height="1" fill="#111" opacity="0.6"/>
  <rect x="34" y="79.8" width="32" height="1" fill="#111" opacity="0.6"/>
</svg>
